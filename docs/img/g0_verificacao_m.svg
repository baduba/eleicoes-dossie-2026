    <dc:title>Cobertura de verificação da cadeia do voto</dc:title>
    <dc:description>Barra empilhada dos 12 elos da cadeia do voto: 4 verificados (33%), 5 parcialmente verificados (42%) e 3 não verificáveis com dados públicos (25%). Uma segunda barra indica que 100% dos votos atravessam pelo menos um elo não verificável.</dc:description>
