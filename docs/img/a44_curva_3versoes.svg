    <dc:title>Curva acumulada de apuração, 2º turno de 2026, em três versões</dc:title>
    <dc:description>Percentual acumulado de Lula sobre os votos válidos em três versões: (a) boletins recebidos, (b) totalizados e (c) mista (eixo X de uma contagem e percentual da outra). Eixo Y de 0 a 100% com o resultado final marcado (51,78%, margem de 4.430.191 votos). Nenhuma versão apresenta queda vertical.</dc:description>
