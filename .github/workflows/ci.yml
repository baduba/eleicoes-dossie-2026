name: ci
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Testes de consistencia (amostra pequena)
        run: python -m pytest -q tests
      - name: O portal compila
        run: python scripts/build_site.py --saida site_teste
